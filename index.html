<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可以成为我的恋人吗？</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f8d7e3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        /* 主页面容器 */
        .page {
            width: 100%;
            max-width: 420px;
            text-align: center;
            padding: 20px;
        }
        .title {
            font-size: 38px;
            color: #7a455a;
            font-weight: bold;
            margin-bottom: 40px;
        }

        /* 卡通形象 */
        .cartoon-box {
            width: 220px;
            height: 220px;
            margin: 0 auto 50px;
            position: relative;
        }
        .cat {
            width: 180px;
            height: 180px;
            background: #fff;
            border: 3px solid #222;
            border-radius: 48% 48% 45% 45%;
            position: relative;
            margin: 0 auto;
        }
        /* 耳朵 */
        .cat::before, .cat::after {
            content: '';
            position: absolute;
            top: -22px;
            width: 55px;
            height: 65px;
            background: #fff;
            border: 3px solid #222;
            border-radius: 50% 50% 30% 30%;
            border-bottom: none;
        }
        .cat::before { left: 18px; }
        .cat::after { right: 18px; }

        /* 灰色斑块 */
        .patch {
            position: absolute;
            top: 12px;
            left: 18px;
            width: 75px;
            height: 55px;
            background: #d3d3d3;
            border-radius: 50%;
            z-index: 2;
        }

        /* 眼睛 */
        .eyes {
            position: absolute;
            top: 75px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 45px;
        }
        .eye {
            width: 22px;
            height: 9px;
            background: #222;
            border-radius: 10px;
        }

        /* 腮红 */
        .cheek {
            position: absolute;
            top: 95px;
            width: 32px;
            height: 22px;
            background: #ffb6c1;
            border-radius: 50%;
            opacity: 0.8;
        }
        .cheek.l { left: 22px; }
        .cheek.r { right: 22px; }

        /* 嘴巴 */
        .mouth {
            position: absolute;
            top: 115px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 14px;
            border-bottom: 3px solid #222;
            border-radius: 0 0 50% 50%;
        }

        /* 手和爱心 */
        .hands {
            position: absolute;
            bottom: 15px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 18px;
        }
        .hand {
            width: 32px;
            height: 42px;
            background: #fff;
            border: 3px solid #222;
            border-radius: 50%;
        }
        .heart-big {
            position: absolute;
            top: 92px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 42px;
            color: #f5a7b9;
        }
        .heart-small {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            color: #f5a7b9;
        }

        /* 疑惑表情 */
        .confused .eye {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }
        .confused .mouth {
            width: 10px;
            height: 10px;
            border: 3px solid #222;
            border-radius: 50%;
        }
        .question-mark {
            position: absolute;
            top: -5px;
            right: 5px;
            font-size: 42px;
            font-weight: bold;
            color: #222;
            display: none;
        }
        .confused .question-mark { display: block; }

        /* 生气表情 */
        .angry .eye {
            width: 22px;
            height: 9px;
        }
        .angry .eye.l { transform: rotate(-12deg); }
        .angry .eye.r { transform: rotate(12deg); }
        .angry .mouth {
            width: 22px;
            height: 10px;
            border-top: 3px solid #222;
            border-bottom: none;
            border-radius: 50% 50% 0 0;
        }
        .angry-mark {
            position: absolute;
            top: 25px;
            right: 18px;
            font-size: 32px;
            color: #c85a5a;
            display: none;
        }
        .angry .angry-mark { display: block; }

        /* 委屈表情 */
        .sad .eye {
            width: 26px;
            height: 32px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid #222;
            position: relative;
        }
        .sad .eye::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 16px;
            background: #222;
            border-radius: 50%;
        }
        .tear {
            position: absolute;
            top: 105px;
            left: 32px;
            width: 14px;
            height: 22px;
            background: #9ad0f0;
            border-radius: 0 0 50% 50%;
            display: none;
        }
        .sad .tear { display: block; }

        /* 按钮区域 */
        .btn-wrap {
            position: relative;
            height: 80px;
            width: 100%;
        }
        .btn {
            padding: 16px 42px;
            font-size: 30px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            position: absolute;
            transition: background 0.2s;
        }
        .btn-yes {
            background: #df7892;
            left: calc(50% - 115px);
        }
        .btn-yes:hover { background: #d06682; }
        .btn-no {
            background: #6a8ac2;
            right: calc(50% - 115px);
        }

        /* 成功页面 */
        .success-page {
            display: none;
        }
        .success-title {
            font-size: 42px;
            color: #7a455a;
            font-weight: bold;
            margin-bottom: 40px;
        }
        .couple {
            display: flex;
            justify-content: center;
            gap: -30px;
        }
        .couple .cat {
            width: 130px;
            height: 130px;
        }
        .couple .cat:nth-child(2) .patch {
            left: auto;
            right: 18px;
            background: #c2b09e;
        }
    </style>
</head>
<body>
    <!-- 主页面 -->
    <div class="page" id="main">
        <h1 class="title">可以成为我的恋人吗？</h1>
        <div class="cartoon-box" id="cartoon">
            <div class="cat">
                <div class="patch"></div>
                <div class="eyes">
                    <div class="eye l"></div>
                    <div class="eye r"></div>
                </div>
                <div class="cheek l"></div>
                <div class="cheek r"></div>
                <div class="mouth"></div>
                <div class="hands">
                    <div class="hand"></div>
                    <div class="hand"></div>
                </div>
                <div class="heart-big">♡</div>
                <div class="heart-small">♡</div>
                <div class="question-mark">?</div>
                <div class="angry-mark">💢</div>
                <div class="tear"></div>
            </div>
        </div>
        <div class="btn-wrap">
            <button class="btn btn-yes" id="yesBtn">可以</button>
            <button class="btn btn-no" id="noBtn">不要</button>
        </div>
    </div>

    <!-- 成功页面 -->
    <div class="page success-page" id="success">
        <h1 class="success-title">喜欢你!! ( >ᗜ< )♡</h1>
        <div class="couple">
            <div class="cat">
                <div class="patch"></div>
                <div class="eyes">
                    <div class="eye l"></div>
                    <div class="eye r"></div>
                </div>
                <div class="mouth"></div>
            </div>
            <div class="cat">
                <div class="patch"></div>
                <div class="eyes">
                    <div class="eye l"></div>
                    <div class="eye r"></div>
                </div>
                <div class="mouth"></div>
            </div>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const cartoon = document.getElementById('cartoon');
        const mainPage = document.getElementById('main');
        const successPage = document.getElementById('success');

        // 拒绝的阶段文案和对应表情
        const stepText = ['不要', '？你认真的吗...', '要不再想想', '不许选这个', '真的不可以吗'];
        const stepExpr = ['', 'confused', '', 'angry', 'sad'];
        let count = 0;

        // 鼠标靠近/点击拒绝按钮都会逃跑
        noBtn.addEventListener('mouseenter', runAway);
        noBtn.addEventListener('click', runAway);

        function runAway() {
            count = Math.min(count + 1, stepText.length - 1);
            
            // 更新按钮文字和卡通表情
            noBtn.textContent = stepText[count];
            cartoon.className = 'cartoon-box ' + stepExpr[count];

            // 随机位置（不超出屏幕）
            const maxX = window.innerWidth - noBtn.offsetWidth - 30;
            const maxY = window.innerHeight - noBtn.offsetHeight - 100;
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = Math.random() * maxX + 'px';
            noBtn.style.top = Math.random() * maxY + 'px';
        }

        // 点击同意
        yesBtn.addEventListener('click', () => {
            mainPage.style.display = 'none';
            successPage.style.display = 'block';
        });
    </script>
</body>
</html>
